[project]
name = "shortlink"
version = "1.0.0"
description = "Serverless URL shortener"
requires-python = ">=3.11"
readme = "README.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["backend", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["BLE001"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
